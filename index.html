<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .video-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 800px;
            background: #000;
            z-index: 1001;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .video-container.fullscreen {
            width: 100%;
            height: 100%;
            max-width: none;
            top: 0;
            left: 0;
            transform: none;
            border-radius: 0;
        }
        
        .video-iframe {
            width: 100%;
            height: 450px;
            border: none;
        }
        
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .share-protection {
            position: absolute;
            top: 0;
            right: 0;
            width: 15%;
            height: 15%;
            z-index: 1002;
            cursor: pointer;
        }
        
        .lock-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            color: red;
            font-size: 24px;
            z-index: 1003;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            max-width: 80%;
            text-align: center;
        }
        
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .video-container {
                width: 95%;
            }
            .video-iframe {
                height: 300px;
            }
            .lock-icon {
                font-size: 18px;
                right: 5px;
                top: 5px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Protected Video Player</h1>
        <p class="text-gray-600">Click below to watch the exclusive content</p>
    </div>
    
    <button id="openVideoBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-full flex items-center transition-all duration-300 transform hover:scale-105">
        <i class="fas fa-play mr-2"></i>
        Watch Video
    </button>
    
    <div id="videoContainer" class="video-container">
        <div class="relative w-full h-full">
            <iframe id="videoFrame" class="video-iframe" 
                    src="https://www.youtube.com/embed/8fTdGriZOU0?modestbranding=1&rel=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; encrypted-media; gyroscope" 
                    allowfullscreen></iframe>
            
            <div class="share-protection" id="shareProtection"></div>
            <i class="fas fa-lock lock-icon"></i>
            
            <div class="controls">
                <button id="fullscreenBtn" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded">
                    <i class="fas fa-expand mr-2"></i> Fullscreen
                </button>
                <button id="closeVideoBtn" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded">
                    <i class="fas fa-times mr-2"></i> Close
                </button>
            </div>
        </div>
    </div>
    
    <div id="overlay" class="overlay"></div>
    
    <div id="popup" class="popup">
        <div class="text-red-500 text-4xl mb-4">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <h3 class="text-xl font-bold mb-2">Sharing Restricted</h3>
        <p class="mb-4">This content cannot be shared.</p>
        <button id="closePopupBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded">
            OK
        </button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const openVideoBtn = document.getElementById('openVideoBtn');
            const videoContainer = document.getElementById('videoContainer');
            const videoFrame = document.getElementById('videoFrame');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const closeVideoBtn = document.getElementById('closeVideoBtn');
            const shareProtection = document.getElementById('shareProtection');
            const popup = document.getElementById('popup');
            const overlay = document.getElementById('overlay');
            const closePopupBtn = document.getElementById('closePopupBtn');

            // Open video
            openVideoBtn.addEventListener('click', function() {
                videoContainer.style.display = 'block';
                overlay.style.display = 'block';
                document.body.style.overflow = 'hidden';
                videoFrame.src += "&autoplay=1";
            });

            // Fullscreen toggle
            fullscreenBtn.addEventListener('click', function() {
                videoContainer.classList.toggle('fullscreen');
                fullscreenBtn.querySelector('i').classList.toggle('fa-expand');
                fullscreenBtn.querySelector('i').classList.toggle('fa-compress');
            });

            // Share protection
            shareProtection.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showPopup();
                closeVideo();
            });

            // Close video function
            function closeVideo() {
                videoContainer.style.display = 'none';
                overlay.style.display = 'none';
                document.body.style.overflow = 'auto';
                videoContainer.classList.remove('fullscreen');
                videoFrame.src = videoFrame.src.replace("&autoplay=1", "");
                fullscreenBtn.querySelector('i').classList.replace('fa-compress', 'fa-expand');
            }

            // Show popup
            function showPopup() {
                popup.style.display = 'block';
                setTimeout(() => {
                    popup.style.display = 'none';
                }, 2000);
            }

            // Click handling
            overlay.addEventListener('click', function(e) {
                if (!videoContainer.contains(e.target)) {
                    closeVideo();
                }
            });

            videoContainer.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            // Event listeners
            closeVideoBtn.addEventListener('click', closeVideo);
            closePopupBtn.addEventListener('click', () => popup.style.display = 'none');
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeVideo();
            });
        });
    </script>
</body>
</html>
