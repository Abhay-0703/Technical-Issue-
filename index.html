        body {

        .search-container {

            width: 100%;

        .grid {

        .grid a {
            display: flex;

            justify-content: center;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            text-decoration: none;
            color: #000;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .grid img {
            height: auto;
            width: 24px;
            margin-right: 10px;
        }
        footer {
            background-color: #fff;

            border-top: 1px solid #ccc;
        }
        footer .nav-links {
            display: flex;
            justify-content: space-around;

        footer .nav-links a {
            text-decoration: none;
            text-align: center;
            color: #555;
        }
        footer .nav-links i {

            display: block;
        }
        footer .nav-links .active {
            color: #007bff;
        }

        /* Login System and Profile Styles */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-container input[type="text"],
        .form-container input[type="password"],
        .form-container input[type="file"],
        .form-container select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-container .validation-hints {
            font-size: 12px;
            color: red;
        }
        .form-container .validation-hints.green {
            color: green;
        }
        .form-container .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .form-container button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        #profile-screen {
            position: fixed;
            top: 0;
            right: -100%;
            height: 100%;
            width: 300px;
            background: #fff;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.2);
            transition: right 0.3s ease;
            padding: 20px;
        }
        #profile-screen img {
            display: block;

            border-radius: 50%;
            width: 100px;
            height: 100px;
        }
        #profile-screen h3 {
            text-align: center;
            margin: 10px 0;
        }
        #profile-screen .details {
            margin-top: 20px;
        }
        #profile-screen .details span {
            display: block;
            margin: 5px 0;
        }
        #profile-screen .close-btn {
            display: block;
            text-align: right;
            margin-bottom: 10px;
            cursor: pointer;
            color: #007bff;
        }
    </style>

<style>
    .profile-container {
        position: fixed;
        top: 0;
        right: -100%;
        width: 300px;
        height: 100%;
        background: #f9f9f9;
        box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        transition: right 0.3s ease-in-out;
        z-index: 1000;
    }

    .profile-container.hidden {
        display: none;
    }

    .profile-content {
        padding: 20px;
        text-align: center;
    }

    .profile-content img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
    }

    .profile-content h3 {
        margin: 10px 0 5px;
        font-size: 18px;
        font-weight: bold;
    }

    .profile-content p {
        margin: 5px 0;
        font-size: 16px;
        color: #555;
    }

    .profile-content hr {
        margin: 15px 0;
        border: 0;
        border-top: 1px solid #ccc;
    }

    .close-btn {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .close-btn:hover {
        background: #0056b3;
    }
</style>

<script>
    const showProfileSection = () => {
        const profileSection = document.getElementById("profile-section");
        const userData = JSON.parse(localStorage.getItem("userData"));
        const profileImageContainer = document.getElementById("profile-image");
        const profileName = document.getElementById("profile-name");
        const profileClass = document.getElementById("profile-class");
        const profileDays = document.getElementById("profile-days");

        if (!userData) {
            alert("Please create an account first.");
            return;
        }

        // Populate profile details
        profileImageContainer.innerHTML = `<img src="${userData.profileImage}" alt="Profile Picture">`;
        profileName.textContent = `${userData.fullName} (${userData.username})`;
        profileClass.textContent = `Class: ${userData.userClass}`;

        // Calculate total days since account creation
        const accountCreatedDate = new Date(userData.accountCreated);
        const today = new Date();
        const totalDays = Math.floor((today - accountCreatedDate) / (1000 * 60 * 60 * 24));
        profileDays.textContent = totalDays;

        // Show the profile section
        profileSection.classList.remove("hidden");
        profileSection.style.right = "0";
    };

    const hideProfileSection = () => {
        const profileSection = document.getElementById("profile-section");
        profileSection.style.right = "-100%";
        setTimeout(() => profileSection.classList.add("hidden"), 300);
    };

    // Event listener for Profile button
    document.getElementById("profile-btn").addEventListener("click", showProfileSection);

    // Event listener for Close button
    document.getElementById("close-profile").addEventListener("click", hideProfileSection);
</script>

<body>
    <div id="app-content"></div>
    <script>
        const getStoredData = (key) => JSON.parse(localStorage.getItem(key)) || null;
        const setStoredData = (key, data) => localStorage.setItem(key, JSON.stringify(data));
        const removeStoredData = (key) => localStorage.removeItem(key);

        const checkLoginPrompt = () => {
            const lastLoginDate = getStoredData("lastLoginDate");
            const currentDate = new Date().toDateString();

            if (!lastLoginDate || lastLoginDate !== currentDate) {
                setStoredData("lastLoginDate", currentDate);
                showLoginSignupForm();
            }
        };

        const showLoginSignupForm = () => {
            const overlay = document.createElement("div");
            overlay.className = "overlay";
            overlay.innerHTML = `
                <div class="form-container">
                    <h2>स्वागत है</h2>
                    <button class="btn-primary" id="create-account-btn">नया एकाउंट बनाये</button>
                    <button class="btn-secondary" id="login-btn">पहले से एकाउंट है</button>
                </div>
            `;
            document.body.appendChild(overlay);

            document.getElementById("create-account-btn").addEventListener("click", showCreateAccountForm);
            document.getElementById("login-btn").addEventListener("click", showLoginForm);
        };

        const showCreateAccountForm = () => {
            const overlay = document.querySelector(".overlay");
            overlay.innerHTML = `
                <div class="form-container">
                    <h2>नया एकाउंट बनाये</h2>
                    <input type="text" id="full-name" placeholder="पूरा नाम" />
                    <input type="text" id="username" placeholder="यूजर नेम" />
                    <div class="validation-hints" id="username-hints">
                        <div id="hint-min-5">कम से कम 5 अक्षर का यूजर Name बनाये</div>
                        <div id="hint-3-alpha">कम से कम 3 अंग्रेजी के अक्षरों का उपयोग करें</div>
                        <div id="hint-number">नम्बर का उपयोग करें</div>
                    </div>
                    <input type="text" id="class" placeholder="कक्षा दर्ज करें" />
                    <input type="password" id="password" placeholder="पासवर्ड बनाये" />
                    <input type="password" id="confirm-password" placeholder="पासवर्ड की पुष्टि करें" />
                    <input type="file" id="profile-image" accept="image/*" />
                    <div id="image-preview"></div>
                    <button class="btn-primary" id="submit-account-btn" disabled>अकाउंट बनाएं</button>
                    <button class="btn-secondary" id="cancel-create-btn">रद्द करें</button>
                </div>
            `;

            const usernameInput = document.getElementById("username");
            const confirmPasswordInput = document.getElementById("confirm-password");

            usernameInput.addEventListener("input", validateUsername);
            confirmPasswordInput.addEventListener("input", validatePasswords);

            document.getElementById("profile-image").addEventListener("change", previewImage);
            document.getElementById("submit-account-btn").addEventListener("click", createAccount);
            document.getElementById("cancel-create-btn").addEventListener("click", () => {
                document.body.removeChild(document.querySelector(".overlay"));
            });
        };

        const validateUsername = () => {
            const username = document.getElementById("username").value;
            const hintMin5 = document.getElementById("hint-min-5");
            const hint3Alpha = document.getElementById("hint-3-alpha");
            const hintNumber = document.getElementById("hint-number");

            const min5 = username.length >= 5;
            const alphaCount = username.replace(/[^a-zA-Z]/g, "").length >= 3;
            const hasNumber = /\d/.test(username);

            hintMin5.className = min5 ? "validation-hints green" : "validation-hints";
            hint3Alpha.className = alphaCount ? "validation-hints green" : "validation-hints";
            hintNumber.className = hasNumber ? "validation-hints green" : "validation-hints";

            toggleSubmitButton(min5 && alphaCount && hasNumber);
        };

        const validatePasswords = () => {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            toggleSubmitButton(password === confirmPassword && password.length > 0);
        };

        const toggleSubmitButton = (valid) => {
            const submitButton = document.getElementById("submit-account-btn");
            submitButton.disabled = !valid;
        };

        const previewImage = (event) => {
            const imagePreview = document.getElementById("image-preview");
            imagePreview.innerHTML = "";
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = document.createElement("img");
                    img.src = reader.result;
                    imagePreview.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
        };

        const createAccount = () => {
            const fullName = document.getElementById("full-name").value;
            const username = document.getElementById("username").value;
            const userClass = document.getElementById("class").value;
            const password = document.getElementById("password").value;
            const profileImage = document.getElementById("profile-image").files[0];

            const reader = new FileReader();
            reader.onload = () => {
                const userData = {
                    fullName,
                    username,
                    userClass,
                    password,
                    profileImage: reader.result,
                    accountCreated: new Date(),
                };
                setStoredData("userData", userData);
                alert("Account created successfully!");
                document.body.removeChild(document.querySelector(".overlay"));
            };
            reader.readAsDataURL(profileImage);
        };

        const showLoginForm = () => {
            const overlay = document.querySelector(".overlay");
            overlay.innerHTML = `
                <div class="form-container">
                    <h2>लॉग इन करें</h2>
                    <input type="text" id="login-username" placeholder="यूजर नेम" />
                    <input type="password" id="login-password" placeholder="पासवर्ड" />
                    <button class="btn-primary" id="login-submit-btn">लॉग इन</button>
                </div>
            `;
            document.getElementById("login-submit-btn").addEventListener("click", loginUser);
        };

        const loginUser = () => {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;
            const userData = getStoredData("userData");

            if (!userData) {
                alert("Account not found. Please create an account.");
                return;
            }

            if (userData.username === username && userData.password === password) {
                alert("Welcome back, " + userData.fullName);
                document.body.removeChild(document.querySelector(".overlay"));
            } else {
                alert("Incorrect details.");
            }
        };

        checkLoginPrompt();
    </script>
</body>
